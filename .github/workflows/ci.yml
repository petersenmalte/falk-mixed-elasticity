name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    container: dolfinx/dolfinx:stable
    steps:
      - uses: actions/checkout@v4

      - name: Install package
        run: pip install --no-cache-dir -e . pytest

      - name: Run tests
        run: pytest -v -s tests/

      - name: Run convergence study
        run: python3 scripts/convergence_study.py

      - name: Run eigenvalue study
        run: python3 scripts/eigenvalue_study.py

      - name: Run postprocessing study
        run: python3 scripts/postprocessing_study.py

      - name: Run adaptive study
        run: python3 scripts/adaptive_study.py

      - name: Run Cook's membrane study
        run: python3 scripts/cooks_membrane_study.py

      - name: Upload convergence results
        uses: actions/upload-artifact@v4
        with:
          name: convergence-results
          path: results/

      - name: Commit generated results
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/
          git diff --staged --quiet || git commit -m "Update generated convergence data [skip ci]"
          git push
